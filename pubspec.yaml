name: ncommander
description: "Ncommander – manager de fișiere cu două panouri, fără reclame (Android)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  archive: ^4.0.2
  crypto: ^3.0.3
  cryptography: ^2.7.0
  ffi: ^2.1.3
  pdfrx: ^3.1.0
  re_highlight: ^0.0.3
  re_editor: ^0.10.0
  flutter_svg: ^2.2.1
  video_player: ^2.9.2
  video_player_win: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: false
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  adaptive_icon_background: "#D9822B"
  adaptive_icon_foreground: "assets/icon_foreground.png"
