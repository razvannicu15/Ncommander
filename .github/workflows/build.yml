name: Build Ncommander

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create --platforms=android --org ro.noraz --project-name ncommander .

      - run: flutter pub get

      - name: Patch manifest / gradle / native code
        run: dart run tool/patch_platforms.dart

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: FTP servers for the tests (pyftpdlib, Pure-FTPd, Pure-FTPd + TLS)
        run: |
          pip install --quiet pyftpdlib
          mkdir -p /tmp/ftproot
          python3 -m pyftpdlib -p 2121 -w -d /tmp/ftproot -u nc -P pw > /tmp/ftp.log 2>&1 &
          sudo apt-get install -y -qq pure-ftpd >/dev/null 2>&1 || sudo apt-get install -y pure-ftpd
          sudo useradd -m -s /bin/bash ncp && echo 'ncp:pw' | sudo chpasswd
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 2 -subj /CN=localhost \
            -keyout /etc/ssl/private/pure-ftpd.pem -out /etc/ssl/private/pure-ftpd.pem 2>/dev/null
          sudo chmod 600 /etc/ssl/private/pure-ftpd.pem
          sudo /usr/sbin/pure-ftpd -B -g /tmp/pf1.pid -S 127.0.0.1,2122 -l unix -E -A -j -p 30000:30049
          sudo /usr/sbin/pure-ftpd -B -g /tmp/pf2.pid -S 127.0.0.1,2123 -l unix -E -A -j -p 30050:30099 -Y 2 -d
          sleep 2
          (echo QUIT | nc -w 3 127.0.0.1 2122) || true

      - name: Unit tests (with real FTP servers)
        env:
          FTP_SERVERS: "pyftpdlib|127.0.0.1|2121|nc|pw|0;pureftpd|127.0.0.1|2122|ncp|pw|0;pureftpd-tls|127.0.0.1|2123|ncp|pw|1"
        run: flutter test

      - name: FTP server log
        if: always()
        continue-on-error: true
        run: |
          sudo journalctl --no-pager -t pure-ftpd | grep -iE "tls|ssl|error|warn|logout|sni" | head -40 || true
          python3 - <<'PY'
          import ftplib, ssl
          try:
              f = ftplib.FTP_TLS(context=ssl._create_unverified_context())
              f.connect('127.0.0.1', 2123, timeout=10); f.login('ncp', 'pw'); f.prot_p()
              print('python PROT P listing:', f.nlst()[:5]); f.quit()
          except Exception as e:
              print('python PROT P failed:', repr(e))
          PY

      # Real renders of every screen (light/dark, RO/EN) for visual review.
      - name: Screenshots
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq fonts-roboto fonts-dejavu-core >/dev/null 2>&1 || true
          SCREEN_FONTS=/usr/share/fonts flutter test --update-goldens test/screens_test.dart
          ls test/screens

      - name: Publish screenshots
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          gh release view screens -R "$REPO" >/dev/null 2>&1 || \
            gh release create screens -R "$REPO" --prerelease --title "Capturi ecran" --notes "Generate automat de CI."
          gh release upload screens test/screens/*.png -R "$REPO" --clobber

      - name: Build APK
        run: |
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          BUILT=$(TZ=Europe/Bucharest date +'%d.%m %H:%M')
          flutter build apk --release --target-platform android-arm64 --build-number=$BUILD --build-name=0.1.$BUILD \
            --dart-define=BUILD=$BUILD --dart-define="BUILT=$BUILT"
          cp build/app/outputs/flutter-apk/app-release.apk Ncommander-android.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
              gh release create "$TAG" -R "$REPO" --title "Ncommander $TAG" --generate-notes
          else
            TAG=latest
            gh release view latest -R "$REPO" >/dev/null 2>&1 || \
              gh release create latest -R "$REPO" --target "$GITHUB_SHA" --latest \
                --title "Ncommander - ultima versiune" --notes "Build automat."
            gh release edit latest -R "$REPO" --notes "Versiunea 0.1.$((100 + GITHUB_RUN_NUMBER)) din $(TZ=Europe/Bucharest date +'%d.%m.%Y %H:%M') (commit ${GITHUB_SHA::7}). Versiunea apare in Setari > Despre."
          fi
          gh release upload "$TAG" Ncommander-android.apk -R "$REPO" --clobber

  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        # android/ too: the icon generator expects it.
        run: flutter create --platforms=windows,android --org ro.noraz --project-name ncommander .

      - run: flutter pub get

      - name: Patch runner
        run: dart run tool/patch_platforms.dart

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Build
        env:
          GOOGLE_DESKTOP_ID: ${{ secrets.GOOGLE_DESKTOP_ID }}
          GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}
        run: |
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          BUILT=$(TZ=Europe/Bucharest date +'%d.%m %H:%M')
          flutter build windows --release --build-number=$BUILD --build-name=0.1.$BUILD \
            --dart-define=BUILD=$BUILD --dart-define="BUILT=$BUILT" \
            --dart-define="GOOGLE_DESKTOP_ID=$GOOGLE_DESKTOP_ID" --dart-define="GOOGLE_DESKTOP_SECRET=$GOOGLE_DESKTOP_SECRET"
          mv build/windows/x64/runner/Release/ncommander.exe build/windows/x64/runner/Release/Ncommander.exe
          cd build/windows/x64/runner/Release && 7z a -tzip "$GITHUB_WORKSPACE/Ncommander-windows.zip" . >/dev/null
          ls -la "$GITHUB_WORKSPACE/Ncommander-windows.zip"

      - name: Smoke test (starts and keeps running)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\windows\x64\runner\Release\Ncommander.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "Ncommander.exe exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "Ncommander.exe ran for 12 s"

      - name: Screenshots on Windows
        continue-on-error: true
        shell: pwsh
        run: ./tool/win_shot.ps1 -Exe "build\windows\x64\runner\Release\Ncommander.exe" -Out winshots

      - name: Publish Windows screenshots
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          gh release view screens -R "$REPO" >/dev/null 2>&1 || \
            gh release create screens -R "$REPO" --prerelease --title "Capturi ecran" --notes "Generate automat de CI." || true
          gh release upload screens winshots/*.png -R "$REPO" --clobber

      - name: Publish
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view latest -R "$REPO" >/dev/null 2>&1 || \
            gh release create latest -R "$REPO" --target "$GITHUB_SHA" --latest \
              --title "Ncommander - ultima versiune" --notes "Build automat." || true
          gh release upload latest Ncommander-windows.zip -R "$REPO" --clobber
